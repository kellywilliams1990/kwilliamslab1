
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelly Williams - First Web Map</title>

    <link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            margin: 10px;
        }

        #map {
            width: 100%;
            height: calc(100% - 60px);
        }
    </style>
</head>

<body>
    <h2>Kelly Williams - Texas A&M Campus Map</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map at Texas A&M
        var map = L.map('map').setView([30.613, -96.340], 15);

        // Add OpenStreetMap background
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Coordinates for TAMU landmarks
        var kyleField = [30.6084, -96.3402];
        var omBuilding = [30.6179, -96.3386];
        var academicBuilding = [30.6159, -96.3413];

        // Locate function - 10 points
        map.locate({setView: true, maxZoom: 16});

        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("Your detected location. Accuracy: " +
                           e.accuracy.toFixed(0) + " meters.");

            L.circle(e.latlng, radius).addTo(map);
        }

        function onLocationError(e) {
            console.log("Location unavailable: " + e.message);
            map.setView([30.613, -96.340], 15);
        }

        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        // Kyle Field circle and popup - 10 points
        L.circle(kyleField, {
            color: 'maroon',
            fillColor: '#800000',
            fillOpacity: 0.35,
            radius: 180
        }).addTo(map)
          .bindPopup("<b>Kyle Field</b><br>Home of Texas A&M Football!");

        // Custom icons - 20 points
        var greenIcon = L.icon({
            iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png',
            shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
            iconSize: [38, 95],
            shadowSize: [50, 64],
            iconAnchor: [22, 94],
            shadowAnchor: [4, 62],
            popupAnchor: [-3, -76]
        });

        var redIcon = L.icon({
            iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-red.png',
            shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
            iconSize: [38, 95],
            shadowSize: [50, 64],
            iconAnchor: [22, 94],
            shadowAnchor: [4, 62],
            popupAnchor: [-3, -76]
        });

        // O&M Building marker
        L.marker(omBuilding, {icon: greenIcon})
            .addTo(map)
            .bindPopup("<b>O&M Building</b><br>Texas A&M University");

        // Academic Building marker
        L.marker(academicBuilding, {icon: redIcon})
            .addTo(map)
            .bindPopup("<b>Academic Building</b><br>Texas A&M University");

        // Map click coordinates popup - 10 points
        map.on('click', function(e) {
            L.popup()
                .setLatLng(e.latlng)
                .setContent(
                    "<b>Coordinates:</b><br>" +
                    "Latitude: " + e.latlng.lat.toFixed(6) +
                    "<br>Longitude: " + e.latlng.lng.toFixed(6)
                )
                .openOn(map);
        });

    </script>
</body>
</html>
