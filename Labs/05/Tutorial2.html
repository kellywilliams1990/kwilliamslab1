
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 - Leaflet Tutorial 2</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Create a mobile-friendly map
    var map = L.map('map').fitWorld();

    // Add OpenStreetMap background
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Find the user's location
    map.locate({setView: true, maxZoom: 16});

    // Show location when found
    function onLocationFound(e) {
        var radius = e.accuracy / 2;

        L.marker(e.latlng).addTo(map)
            .bindPopup("You are within " + radius +
                       " meters from this point.")
            .openPopup();

        L.circle(e.latlng, radius).addTo(map);
    }

    // Show error if location is unavailable
    function onLocationError(e) {
        alert(e.message);
        map.setView([30.6280, -96.3344], 13);
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);
</script>

</body>
</html>
